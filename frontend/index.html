<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kenali Hewan Peliharaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF2F3; --panel:#FFFFFF; --ink:#10222B; --muted:#5B6E78; --line:#D5DEE2;
    --teal:#0E7C86; --teal-soft:#E2F1F2; --coral:#D9603B; --coral-dark:#C2502D; --track:#E3EAED;
    --head:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
  main{max-width:1000px;margin:0 auto;padding:44px 20px 72px}

  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:34px}
  .brand{display:flex;align-items:center;gap:10px;font:700 .95rem var(--body);color:var(--teal)}
  .brand svg{width:26px;height:26px}
  .srv{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:500;color:var(--muted);
       background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  .srv i{width:8px;height:8px;border-radius:50%;background:#B9C4CA}
  .srv.ok i{background:#22A06B} .srv.bad{color:#B3261E;border-color:#E6B8B4} .srv.bad i{background:#B3261E}

  h1{font:800 clamp(2.4rem,6vw,3.8rem)/1.02 var(--head);letter-spacing:-.035em;margin:0 0 14px;max-width:13ch}
  .lead{font-size:1.05rem;color:var(--muted);margin:0 0 34px;max-width:46ch}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:stretch}
  @media(max-width:780px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;
         box-shadow:0 1px 2px rgba(16,34,43,.04),0 12px 32px -18px rgba(16,34,43,.18)}

  #drop{position:relative;display:grid;place-items:center;aspect-ratio:1/1;border:2px dashed #7FB8BD;border-radius:14px;
        background:var(--teal-soft);cursor:pointer;overflow:hidden;text-align:center;padding:22px;color:var(--muted);
        transition:background .15s,border-color .15s}
  #drop:hover,#drop.over,#drop:focus-visible{background:#D4EBED;border-color:var(--teal);outline:none}
  #drop.has{border-style:solid;border-color:var(--line);background:#000;padding:0}
  #drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #hint{max-width:30ch}
  #hint svg{width:44px;height:44px;color:var(--teal);margin-bottom:10px}
  #hint strong{display:block;color:var(--ink);font:700 1.05rem var(--body);margin-bottom:4px}
  #hint small{font-size:.85rem}
  input[type=file]{display:none}

  .btns{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}
  button{font:700 1rem var(--body);border:0;border-radius:12px;padding:14px 18px;cursor:pointer;transition:background .15s,transform .05s}
  #go{background:var(--coral);color:#fff}
  #go:hover:not(:disabled){background:var(--coral-dark)}
  #go:active:not(:disabled){transform:translateY(1px)}
  #go:disabled{background:#BBC6CC;cursor:not-allowed}
  #reset{background:transparent;color:var(--muted);border:1px solid var(--line)}
  #reset:hover{background:var(--bg);color:var(--ink)}
  button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

  .empty{height:100%;min-height:240px;display:grid;place-items:center;text-align:center;color:var(--muted)}
  .tag{display:inline-block;font:700 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--teal);
       background:var(--teal-soft);border-radius:999px;padding:4px 10px;margin-bottom:10px}
  .species{font:800 clamp(2.4rem,5vw,3.2rem)/1 var(--head);letter-spacing:-.03em;margin:0 0 12px}
  .meter{height:10px;background:var(--track);border-radius:5px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--teal);border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .meta{display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted);margin-top:6px}
  .warn{margin-top:12px;font-size:.88rem;color:#8A5A00;background:#FFF4D9;border-radius:10px;padding:8px 12px}

  h2{font:700 .78rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
  .top1{font:700 1.35rem/1.25 var(--head);letter-spacing:-.01em;margin:0 0 8px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .top1 span:last-child{color:var(--coral);white-space:nowrap}
  .row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin-top:14px;font-size:.93rem}
  .row .meter{grid-column:1/-1;height:6px}
  .row .meter i{background:#9BB4BC}
  .err{color:#B3261E;font-weight:600}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><ellipse cx="6" cy="10" rx="2.2" ry="3"/><ellipse cx="10.5" cy="5.5" rx="2.2" ry="3"/><ellipse cx="16.5" cy="6" rx="2.2" ry="3"/><ellipse cx="20" cy="11.5" rx="2" ry="2.8"/><path d="M12.4 11c-3 0-6 3.6-6 6.3 0 1.8 1.4 2.7 3 2.7 1.2 0 1.8-.5 3-.5s1.8.5 3 .5c1.6 0 3-.9 3-2.7 0-2.7-3-6.3-6-6.3z"/></svg>
      Pet Classifier
    </div>
    <span id="srv" class="srv"><i></i><span>Memeriksa server...</span></span>
  </div>

  <h1>Kucing atau anjing?</h1>
  <p class="lead">Unggah satu foto. Model akan menebak spesies dan jenis hewannya.</p>

  <div class="grid">
    <section class="panel" aria-label="Unggah foto">
      <label id="drop" tabindex="0" for="file">
        <span id="hint"></span>
      </label>
      <input id="file" type="file" accept="image/*">
      <div class="btns">
        <button id="go" disabled>Kenali hewan</button>
        <button id="reset" type="button">Ganti foto</button>
      </div>
    </section>

    <section class="panel" aria-live="polite" id="out">
      <div class="empty">Hasil akan muncul di sini.</div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const drop = $("drop"), fileInput = $("file"), go = $("go"), out = $("out");
let current = null, API = null;

function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }
const pct = p => (p * 100).toFixed(1).replace(".", ",") + "%";

/* ---------- area unggah ---------- */
function defaultHint(){
  const h = $("hint"); h.replaceChildren();
  h.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>'
    + '<strong>Pilih atau seret foto ke sini</strong><small>JPG, PNG, atau WebP, maks. 10 MB</small>';
  h.style.display = "";
  drop.classList.remove("has");
}
function showHint(t){
  drop.querySelectorAll("img").forEach(n => n.remove());
  drop.classList.remove("has");
  const h = $("hint"); h.style.display = ""; h.textContent = t;
}
function resetAll(){
  current = null; fileInput.value = ""; go.disabled = true;
  drop.querySelectorAll("img").forEach(n => n.remove());
  defaultHint();
  out.replaceChildren(el("div", "empty", "Hasil akan muncul di sini."));
}
defaultHint();

function tryLoad(src){
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("decode")); i.src = src; });
}
async function loadImage(f){
  const u = URL.createObjectURL(f);
  try{ return {img: await tryLoad(u), url: u}; } catch(e){ URL.revokeObjectURL(u); }
  const d = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error("read")); r.readAsDataURL(f); });
  return {img: await tryLoad(d), url: d};
}
function toJpeg(img){
  const s = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.naturalWidth * s));
  c.height = Math.max(1, Math.round(img.naturalHeight * s));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.92));
}
async function setFile(f){
  if(!f) return;
  const info = f.name + " (" + (f.type || "tipe tidak diketahui") + ", " + Math.round(f.size / 1024) + " KB)";
  if(f.size === 0){
    current = null; go.disabled = true;
    showHint("File kosong atau tidak terbaca: " + info + ". Jika file ada di iCloud, unduh dulu ke komputer.");
    return;
  }
  current = f; go.disabled = false;
  try{
    const {img, url} = await loadImage(f);
    const blob = await toJpeg(img);
    if(blob) current = blob;
    drop.querySelectorAll("img").forEach(n => n.remove());
    const p = document.createElement("img"); p.alt = "Foto yang dipilih"; p.src = url;
    drop.appendChild(p); drop.classList.add("has");
    $("hint").style.display = "none";
  }catch(e){
    showHint("Pratinjau tidak bisa ditampilkan untuk " + info + ". Foto tetap bisa dikirim, klik Kenali hewan.");
  }
}
fileInput.addEventListener("change", () => setFile(fileInput.files[0]));
["dragenter","dragover"].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.add("over");}));
["dragleave","drop"].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.remove("over");}));
drop.addEventListener("drop", ev => setFile(ev.dataTransfer.files[0]));
drop.addEventListener("keydown", ev => { if(ev.key === "Enter" || ev.key === " "){ev.preventDefault(); fileInput.click();} });
$("reset").addEventListener("click", resetAll);

/* ---------- server ---------- */
async function findApi(){
  for(const b of ["", "/api", "http://127.0.0.1:8010", "http://127.0.0.1:8000"]){
    try{
      const r = await fetch(b + "/health", {cache: "no-store"});
      if(!r.ok) continue;
      const j = await r.json();
      if(j && j.status === "ok" && "breeds" in j) return b;
    }catch(e){}
  }
  return null;
}
async function checkServer(){
  const box = $("srv");
  API = await findApi();
  if(API === null){
    box.className = "srv bad";
    box.lastElementChild.textContent = "Server model tidak ditemukan";
    box.title = "Jalankan: uvicorn backend.app:app --port 8010, lalu muat ulang halaman.";
  }else{
    box.className = "srv ok";
    box.lastElementChild.textContent = "Server terhubung";
  }
  return API;
}

/* ---------- hasil ---------- */
function bars(items){
  const f = document.createDocumentFragment();
  items.forEach(it => {
    const r = el("div", "row");
    r.appendChild(el("span", "", it.label));
    r.appendChild(el("span", "", pct(it.prob)));
    const m = el("div", "meter"), i = el("i"); m.appendChild(i); r.appendChild(m);
    f.appendChild(r);
    requestAnimationFrame(() => requestAnimationFrame(() => i.style.width = pct(it.prob).replace(",", ".")));
  });
  return f;
}
function meter(prob){
  const m = el("div", "meter"), i = el("i"); m.appendChild(i);
  requestAnimationFrame(() => requestAnimationFrame(() => i.style.width = (prob * 100).toFixed(1) + "%"));
  return m;
}
function render(data){
  out.replaceChildren();
  out.appendChild(el("span", "tag", "Spesies"));
  out.appendChild(el("p", "species", data.species.name));
  out.appendChild(meter(data.species.prob));
  const meta = el("div", "meta");
  meta.appendChild(el("span", "", "Keyakinan"));
  meta.appendChild(el("span", "", pct(data.species.prob)));
  out.appendChild(meta);
  if(data.species.prob < 0.7) out.appendChild(el("div", "warn", "Keyakinan rendah. Mungkin ini bukan kucing atau anjing, atau fotonya kurang jelas."));

  if(data.breeds.length){
    out.appendChild(el("h2", "", "Jenis"));
    const t = el("p", "top1");
    t.appendChild(el("span", "", data.breeds[0].name));
    t.appendChild(el("span", "", pct(data.breeds[0].prob)));
    out.appendChild(t);
    out.appendChild(meter(data.breeds[0].prob));
    if(data.breeds[0].prob < 0.5) out.appendChild(el("div", "warn", "Jenis kurang pasti, beberapa kemungkinan hampir sama kuat."));
    if(data.breeds.length > 1) out.appendChild(bars(data.breeds.slice(1).map(b => ({label: b.name, prob: b.prob}))));
  }
}

go.addEventListener("click", async () => {
  if(!current) return;
  go.disabled = true; go.textContent = "Menganalisis...";
  const fd = new FormData(); fd.append("file", current, current.name || "foto.jpg");
  try{
    if(API === null && await checkServer() === null) throw new Error("Server model tidak ditemukan. Jalankan uvicorn di port 8010, lalu muat ulang halaman.");
    const res = await fetch(API + "/predict", {method: "POST", body: fd});
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || "Terjadi kesalahan.");
    render(data);
  }catch(e){
    out.replaceChildren(el("p", "err", e instanceof TypeError ? "Foto tidak terkirim. Pastikan server masih berjalan, lalu muat ulang halaman." : e.message));
  }finally{
    go.disabled = false; go.textContent = "Kenali hewan";
  }
});

checkServer();
</script>
</body>
</html>
